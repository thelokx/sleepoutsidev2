<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
      <div class="checkout-body">
        <div>
      <form id="myForm">
        <fieldset>
          <legend>Personal Information</legend>
          <label for="fname">First Name<input type="text" name="fname" title="Provide your first name" autocomplete="given-name"  required></label>
          <label for="lname">Last Name <input type="text" name="lname" title="Provide your last name" autocomplete="family-name"  required></label>
        </fieldset>

        <fieldset>
          <legend>Adress Information</legend>
          <label for="street">Adress<input type="text" name="street" title="Provide your street" autocomplete="street" value="Via Giuseppe Tartini 12" required></label>
          <label for="city">City<input type="text" name="city" title="Provide your city" value="Torino" required></label>
          <label for="state">state<input type="text" name="state" title="Provide your state" value="Piamonte" required></label>
          <label for="cap">Cap<input type="text" name="cap" title="Provide your cap" value="10154" required></label>
        </fieldset>

        <fieldset>
          <legend>Payment Information</legend>
          <label for="creditCard">Credit card<input type="text" name="creditCard" title="Provide your credit-card" value="1234123412341234" required></label>
          <label for="expiration">Exp Date<input type="text" name="expiration" title="Provide your credit expiration date" value="12/25" required></label>
          <label for="securityCode">Security Code<input type="text" name="securityCode" title="Provide your security code" value="123" required></label>
        </fieldset>
        <input id="sendButton" type="submit" value="Place my Order Now">
      </form>
      </div>
      <div class="summary">
        <h2>Order Summary</h2>
        <p>Subtotal : <spam id="subtotal"></spam></p>
        <p>Tax: <spam id="tax"></spam></p>
        <p>Shipping: <spam id="shipping"></spam></p>
        <p>Order Total: <spam id="order-total"></spam></p>
      </div>
    </div>  
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
